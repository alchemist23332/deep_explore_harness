server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: deep-explore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deep_explore}
    username: ${DB_USERNAME:deep_explore}
    password: ${DB_PASSWORD:deep_explore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true

ai:
  model:
    provider: ${AI_PROVIDER:OPENAI_COMPATIBLE}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model-name: ${AI_MODEL_NAME:gpt-4.1-mini}
    deep-model-name: ${AI_DEEP_MODEL_NAME:${AI_MODEL_NAME:gpt-4.1-mini}}
    temperature: ${AI_TEMPERATURE:0.2}
    max-completion-tokens: ${AI_MAX_COMPLETION_TOKENS:512}
    reasoning-effort: ${AI_REASONING_EFFORT:none}
    deep-max-completion-tokens: ${AI_DEEP_MAX_COMPLETION_TOKENS:2048}
    deep-reasoning-effort: ${AI_DEEP_REASONING_EFFORT:low}
    fast-thinking: ${AI_FAST_THINKING:}
    deep-thinking: ${AI_DEEP_THINKING:}
    timeout: ${AI_TIMEOUT:60s}
    log-requests: ${AI_LOG_REQUESTS:false}
    log-responses: ${AI_LOG_RESPONSES:false}
  agent:
    id: ${AI_AGENT_ID:assistant}
    max-tool-calling-round-trips: ${AGENT_MAX_TOOL_CALLING_ROUND_TRIPS:3}

tools:
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    default-provider: ${WEB_SEARCH_PROVIDER:TAVILY}
    max-query-characters: ${WEB_SEARCH_MAX_QUERY_CHARACTERS:${TAVILY_MAX_QUERY_CHARACTERS:400}}
    max-event-result-characters: ${TOOL_MAX_EVENT_RESULT_CHARACTERS:16384}
    jina:
      api-key: ${JINA_API_KEY:}
      base-url: ${JINA_SEARCH_BASE_URL:https://s.jina.ai/}
      timeout: ${JINA_SEARCH_TIMEOUT:20s}
      max-result-characters: ${JINA_MAX_RESULT_CHARACTERS:30000}
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com/}
      timeout: ${TAVILY_TIMEOUT:10s}
      search-depth: ${TAVILY_SEARCH_DEPTH:basic}
      include-answer: false
      include-raw-content: false

sandbox:
  enabled: ${SANDBOX_ENABLED:true}
  owner-id: ${SANDBOX_OWNER_ID:local-user}
  data-directory: ${SANDBOX_DATA_DIR:../.deep-explore-data}
  command-timeout: ${SANDBOX_COMMAND_TIMEOUT:60s}
  max-command-output-bytes: ${SANDBOX_MAX_COMMAND_OUTPUT_BYTES:1048576}
  max-file-bytes: ${SANDBOX_MAX_FILE_BYTES:10485760}
  max-preview-bytes: ${SANDBOX_MAX_PREVIEW_BYTES:1048576}
  max-zip-bytes: ${SANDBOX_MAX_ZIP_BYTES:104857600}
  max-extracted-bytes: ${SANDBOX_MAX_EXTRACTED_BYTES:524288000}
  max-extracted-files: ${SANDBOX_MAX_EXTRACTED_FILES:10000}
  docker:
    host: ${SANDBOX_DOCKER_HOST:${DOCKER_HOST:unix:///var/run/docker.sock}}
    java21-image: ${SANDBOX_JAVA21_IMAGE:deep-explore/sandbox-java21:v1}
    memory-bytes: ${SANDBOX_MEMORY_BYTES:2147483648}
    nano-cpus: ${SANDBOX_NANO_CPUS:2000000000}
    pids-limit: ${SANDBOX_PIDS_LIMIT:256}
    network-mode: ${SANDBOX_NETWORK_MODE:bridge}

app:
  conversation:
    max-messages: ${MAX_CONVERSATION_MESSAGES:20}
    generation-lock-timeout: ${CONVERSATION_LOCK_TIMEOUT:5m}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
